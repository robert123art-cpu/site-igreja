<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redefinir senha — CCJ</title>
<style>
:root{--blue:#244b5a;--gold:#c99a2e;--line:#d7dde0;--bg:#f4f6f7;--ok:#24734b;--danger:#9b2929}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans",sans-serif;background:var(--bg);color:#222}
header{background:linear-gradient(135deg,var(--blue),#183642);color:#fff;padding:22px 16px;text-align:center}.logo{width:58px;height:58px;border:2px solid var(--gold);border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px}.brand{font-weight:800;font-size:19px}.brand small{display:block;font-size:13px;font-weight:400;margin-top:5px}
.card{max-width:520px;margin:28px auto;padding:22px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 12px rgba(0,0,0,.05)}h2{color:var(--blue);margin-top:0}.field{margin-top:15px}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid #c7d0d4;border-radius:9px;font:inherit}.btn{width:100%;padding:13px;margin-top:18px;border:0;border-radius:9px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}.msg{margin-top:14px;padding:12px;border-radius:9px;display:none;line-height:1.45}.ok{display:block;background:#e4f3eb;color:#1f6542}.err{display:block;background:#fdeaea;color:var(--danger)}.back{display:block;text-align:center;margin-top:15px;color:var(--blue);text-decoration:none}
</style>
</head>
<body>
<header><div class="logo">CCJ</div><div class="brand">宗教法人日本 クリスチャンコングレゲーション<small>Redefinição de senha · パスワード再設定</small></div></header>
<main class="card">
<h2 id="title">Redefinir senha</h2>
<div id="requestBox"><p>Informe o e-mail usado na Área Administrativa. Enviaremos um link seguro para criar uma nova senha.</p><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email" placeholder="seu@email.com"></div><button id="send" class="btn">Enviar link para redefinir senha</button></div>
<div id="updateBox" style="display:none"><p>O link foi validado. Digite sua nova senha abaixo.</p><div class="field"><label>Nova senha</label><input id="password" type="password" autocomplete="new-password" minlength="6"></div><div class="field"><label>Confirmar nova senha</label><input id="password2" type="password" autocomplete="new-password" minlength="6"></div><button id="update" class="btn">Salvar nova senha</button></div>
<div id="msg" class="msg"></div><a class="back" href="presenca.html">← Voltar para a Área Administrativa</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://uoapmjwdwtpltnxvmniy.supabase.co';
const SUPABASE_KEY='sb_publishable_10fUBHTtp6sev9kXjMIDJg_CFBkeT8D';
const REDIRECT_URL='https://robert123art-cpu.github.io/site-igreja/redefinir-senha.html';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function show(t,ok=false){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}
function showUpdate(){ $('requestBox').style.display='none'; $('updateBox').style.display='block'; $('title').textContent='Criar nova senha'; }
async function requestReset(){
  const email=$('email').value.trim();
  if(!email){show('Informe seu e-mail.');return}
  $('send').disabled=true;$('send').textContent='Enviando...';
  const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:REDIRECT_URL});
  $('send').disabled=false;$('send').textContent='Enviar link para redefinir senha';
  if(error){show('Não foi possível enviar o link: '+error.message);return}
  show('Link enviado. Verifique sua caixa de entrada e também Spam/Lixo eletrônico. O link abrirá esta página para criar a nova senha.',true)
}
async function updatePassword(){
  const p=$('password').value,p2=$('password2').value;
  if(p.length<6){show('A senha deve ter pelo menos 6 caracteres.');return}
  if(p!==p2){show('As senhas não coincidem.');return}
  $('update').disabled=true;$('update').textContent='Salvando...';
  const {data,error}=await db.auth.updateUser({password:p});
  if(error){$('update').disabled=false;$('update').textContent='Salvar nova senha';show('Não foi possível alterar a senha: '+error.message);return}
  show('Senha alterada com sucesso! Agora você pode voltar para a Área Administrativa e entrar com a nova senha.',true);
  $('password').value='';$('password2').value='';
  setTimeout(()=>location.href='presenca.html',1800);
}
$('send').onclick=requestReset;
$('update').onclick=updatePassword;
$('email').addEventListener('keydown',e=>{if(e.key==='Enter')requestReset()});
$('password2').addEventListener('keydown',e=>{if(e.key==='Enter')updatePassword()});

// Detecta a sessão de recuperação mesmo quando o evento PASSWORD_RECOVERY já ocorreu.
async function detectRecovery(){
  try{
    const hash=window.location.hash||'';
    const query=window.location.search||'';
    const recoveryHint=/access_token=|refresh_token=|type=recovery|code=/.test(hash+' '+query);
    if(recoveryHint){
      const {data}=await db.auth.getSession();
      if(data?.session){showUpdate();return true;}
    }
  }catch(e){console.error(e)}
  return false;
}

db.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY' && session){showUpdate();show('Link de recuperação validado. Agora crie sua nova senha.',true);}
});

detectRecovery();
</script>
</body>
</html>
