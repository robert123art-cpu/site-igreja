script>(function(){const SHARE_URL=location.href.split('#')[0];const VCARD='BEGIN:VCARD\nVERSION:3.0\nN:Tosha;Atos Roberto;;;\nFN:Atos Roberto Tosha\nORG:宗教法人日本 クリスチャンコングレゲーション\nTITLE:Presidente / 管理代表役員（会長）\nTEL;TYPE=CELL,VOICE:+81566931383\nEMAIL:CCj.secretariacentral@outlook.com\nADR;TYPE=WORK:;;愛知県安城市赤松町西下40-8;安城市;愛知県;446-0046;日本\nNOTE:会社法人等番号：1803-05-009092\nEND:VCARD';const status=document.getElementById('status');function msg(t){status.textContent=t;status.style.display='block';clearTimeout(window.__msg);window.__msg=setTimeout(()=>status.style.display='none',3500)}const save=document.getElementById('saveContact');save.href='data:text/vcard;charset=utf-8,'+encodeURIComponent(VCARD);save.setAttribute('download','Atos_Roberto_Tosha.vcf');save.addEventListener('click',function(){msg('Abrindo o contato. Se o iPhone perguntar, escolha “Contatos”.')});document.getElementById('share').addEventListener('click',async function(){try{if(navigator.share){await navigator.share({title:'Cartão Digital CCJ — Atos Roberto Tosha',text:'Cartão Digital CCJ — Atos Roberto Tosha',url:SHARE_URL});return}}catch(e){if(e&&e.name==='AbortError')return}try{await navigator.clipboard.writeText(SHARE_URL);msg('Link copiado. Agora cole no WhatsApp, E-mail ou outro aplicativo.');return}catch(e){}window.prompt('Copie o link do cartão:',SHARE_URL)})})();</script></body></html>
