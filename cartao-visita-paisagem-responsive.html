<title>Cartão Digital CCJ</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef2f7}
body{display:flex;align-items:center;justify-content:center;padding:12px}
.stage{position:relative;width:min(100%,1200px);aspect-ratio:1200/756;overflow:hidden;flex:none}
.inner{position:absolute;left:50%;top:50%;width:1200px;height:756px;transform:translate(-50%,-50%) scale(calc((100vw - 24px)/1200));transform-origin:center}
.inner iframe{display:block;width:1200px;height:756px;border:0;margin:0;padding:0}
@media (min-width:1200px){
 body{padding:0}
 .stage{width:1200px;height:756px}
 .inner{transform:translate(-50%,-50%) scale(1)}
}
</style>
</head>
<body>
<div class="stage">
  <div class="inner">
    <iframe src="cartao-visita.html?v=20261018-7" scrolling="no" title="Cartão Digital CCJ"></iframe>
  </div>
</div>
</body>
