<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#063d78">
<link rel="manifest" href="manifest-paisagem.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Cartão Digital CCJ</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef2f7}
body{display:flex;align-items:center;justify-content:center;padding:12px}
.stage{width:min(calc(100vw - 24px),1200px);aspect-ratio:1200/756;flex:none;overflow:hidden;background:#fff;box-shadow:0 10px 28px rgba(0,0,0,.18)}
.stage iframe{display:block;width:100%;height:100%;border:0;margin:0;padding:0;overflow:hidden}
@media (min-width:1200px){body{padding:0}.stage{width:1200px;height:756px}}
</style>
</head>
<body>
<div class="stage">
<iframe id="cardFrame" src="cartao-visita.html?v=20261019-4" scrolling="no" title="Cartão Digital CCJ"></iframe>
</div>
<script>
const frame=document.getElementById('cardFrame');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const style=doc.createElement('style');
    style.textContent=`
      .body{align-items:flex-start!important;padding:2.8% 3.5%!important;gap:3%!important}
      .info{min-width:0!important}
      .jp{font-size:clamp(18px,3.2vw,38px)!important;line-height:1!important}
      .pt{font-size:clamp(14px,2.2vw,26px)!important;margin-top:6px!important}
      .titlejp{font-size:clamp(9px,1.6vw,19px)!important;margin-top:7px!important}
      .titlept{font-size:clamp(9px,1.5vw,18px)!important;margin-top:3px!important}
      .contact{font-size:clamp(7px,1.35vw,16px)!important;line-height:1.2!important;margin-top:6px!important}
      .qr{flex-basis:18%!important;max-width:170px!important;padding:4px!important}
    `;
    doc.head.appendChild(style);
  }catch(e){}
});
</script>
</body>
</html>
