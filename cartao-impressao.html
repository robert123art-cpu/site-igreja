<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Preparar cartão para impressão</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:#eef3f8;color:#142235;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans",Arial,sans-serif}body{padding:14px}.box{max-width:900px;margin:auto}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.btn{border:0;border-radius:12px;padding:13px 16px;background:#063d78;color:#fff;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer}.btn:disabled{opacity:.55}.hint{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px;line-height:1.45}.preview{background:#fff;border-radius:18px;padding:12px;box-shadow:0 10px 30px #0002}.preview img{display:block;width:100%;height:auto;border-radius:10px}.status{margin:0 0 12px;font-weight:700}</style></head><body><div class="box"><div class="toolbar"><button class="btn" id="shareBtn" type="button" disabled>📤 Compartilhar / Imprimir</button><a class="btn" id="openBtn" href="#" target="_blank" rel="noopener" style="pointer-events:none;opacity:.55">🖼️ Abrir cartão</a><a class="btn" href="cartao-digital.html?v=18">↩ Voltar</a></div><div class="hint"><p class="status" id="status">Preparando o cartão...</p><span>O cartão será preparado como uma imagem com a fotografia. No iPhone, toque em <b>Compartilhar / Imprimir</b> e depois escolha <b>Imprimir</b> na tela do sistema. Se essa opção não aparecer, toque em <b>Abrir cartão</b> e use o botão de compartilhar do Safari.</span></div><div class="preview"><img id="preview" alt="Cartão pronto para impressão"></div></div><script>const $=id=>document.getElementById(id);const fallback="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='600' height='800'><rect width='100%' height='100%' fill='#dbe3eb'/><text x='50%' y='48%' text-anchor='middle' font-family='Arial' font-size='34' fill='#5b6b7d'>FOTOGRAFIA</text></svg>");const qrUrl='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Frobert123art-cpu.github.io%2Fsite-igreja%2Fpresenca.html';let printFile=null,blobUrl='';function get(k,def){try{return sessionStorage.getItem(k)||localStorage.getItem(k)||def}catch(e){return def}}function loadImage(src,cross){return new Promise((resolve,reject)=>{const im=new Image();if(cross)im.crossOrigin='anonymous';im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}function fitImage(ctx,img,x,y,w,h){const s=Math.max(w/img.width,h/img.height),sw=w/s,sh=h/s,sx=(img.width-sw)/2,sy=(img.height-sh)/2;ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h)}function drawText(ctx,text,x,y,size,weight,color,max){ctx.fillStyle=color;ctx.font=weight+' '+size+'px -apple-system,BlinkMacSystemFont,"Noto Sans",Arial,sans-serif';ctx.textBaseline='top';let t=text;if(ctx.measureText(t).width>max){while(t.length>1&&ctx.measureText(t+'…').width>max)t=t.slice(0,-1);t+='…'}ctx.fillText(t,x,y)}async function buildCard(){const W=1712,H=1080,c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#063d78';ctx.fillRect(0,0,W,518);const photo=await loadImage(get('cartaoFoto',fallback));fitImage(ctx,photo,70,58,230,350);ctx.strokeStyle='#c99a32';ctx.lineWidth=12;ctx.strokeRect(70,58,230,350);const org=get('cartaoOrg','宗教法人 日本クリスチャンコングレゲーション'),name=get('cartaoNome','藤社 アトス ロベルト'),title=get('cartaoCargo','管理代表役員（会長）');drawText(ctx,org,345,95,57,'bold','#fff',1280);drawText(ctx,'JAPAN CHRISTIAN CONGREGATION · RELIGIOUS CORPORATION',345,225,27,'normal','#fff',1250);drawText(ctx,name,70,575,62,'bold','#142235',1200);drawText(ctx,'Roberto Tosha',70,665,47,'bold','#063d78',1200);drawText(ctx,title,70,730,38,'bold','#063d78',1050);drawText(ctx,'Presidente da Administração',70,785,33,'normal','#142235',1050);drawText(ctx,'☎ 0566 93 1383',70,850,29,'normal','#142235',1000);drawText(ctx,'✉ CCj.secretariacentral@outlook.com',70,895,29,'normal','#142235',1050);drawText(ctx,'〒446-0046',70,940,29,'normal','#142235',1000);drawText(ctx,'愛知県 安城市 赤松町西下40-8',70,985,27,'normal','#142235',1050);try{const qr=await loadImage(qrUrl,true);ctx.fillStyle='#fff';ctx.fillRect(1340,600,300,380);ctx.strokeStyle='#c99a32';ctx.lineWidth=10;ctx.strokeRect(1340,600,300,380);ctx.drawImage(qr,1360,620,260,260);ctx.fillStyle='#063d78';ctx.fillRect(1360,885,260,75);drawText(ctx,'公式サイト / PRESENÇA',1380,900,24,'bold','#fff',220)}catch(e){}return new Promise(resolve=>c.toBlob(resolve,'image/png'))}async function prepare(){try{const blob=await buildCard();if(!blob)throw Error('blob');printFile=new File([blob],'cartao-igreja.png',{type:'image/png'});blobUrl=URL.createObjectURL(blob);$('preview').src=blobUrl;$('openBtn').href=blobUrl;$('openBtn').style.pointerEvents='auto';$('openBtn').style.opacity='1';$('status').textContent='Cartão pronto. A fotografia foi preservada.';$('shareBtn').disabled=false}catch(e){$('status').textContent='Não foi possível preparar o cartão. Volte e selecione a fotografia novamente.'}}$('shareBtn').addEventListener('click',async()=>{if(!printFile)return;try{const data={files:[printFile],title:'Cartão Digital — Japan Christian Congregation'};if(navigator.share&&navigator.canShare&&navigator.canShare(data)){await navigator.share(data);return}}catch(e){if(e&&e.name==='AbortError')return}if(blobUrl)location.href=blobUrl});prepare();</script></body></html>
