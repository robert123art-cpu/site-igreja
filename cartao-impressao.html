<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="page-version" content="8"><title>Cartão PDF 85,6 × 54 mm</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:#eef3f8;color:#142235;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans",Arial,sans-serif}body{padding:14px}.box{max-width:900px;margin:auto}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.btn{border:0;border-radius:12px;padding:13px 16px;background:#063d78;color:#fff;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer}.btn:disabled{opacity:.55}.hint{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px;line-height:1.45}.preview{background:#fff;border-radius:18px;padding:12px;box-shadow:0 10px 30px #0002}.preview img{display:block;width:100%;height:auto;border-radius:10px}.status{margin:0 0 12px;font-weight:700}</style></head><body><div class="box"><div class="toolbar"><button class="btn" id="shareBtn" disabled>📤 Compartilhar PDF / Imprimir</button><a class="btn" id="openBtn" href="#" target="_blank" rel="noopener" style="pointer-events:none;opacity:.55">📄 Abrir PDF</a><a class="btn" href="cartao-digital.html?v=26">↩ Voltar</a></div><div class="hint"><p class="status" id="status">Preparando PDF...</p><span>O cartão individual tem <b>85,6 × 54 mm</b>. Toque em <b>Compartilhar PDF / Imprimir</b> para abrir as opções do iPhone.</span></div><div class="preview"><img id="preview" alt="Prévia do cartão"></div></div><script>const $=id=>document.getElementById(id);const fallback="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='600' height='800'><rect width='100%' height='100%' fill='#dbe3eb'/><text x='50%' y='48%' text-anchor='middle' font-family='Arial' font-size='34' fill='#5b6b7d'>FOTOGRAFIA</text></svg>");const qrUrl='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Frobert123art-cpu.github.io%2Fsite-igreja%2Fpresenca.html';let pdfFile=null,pdfUrl='';function get(k,d){try{return sessionStorage.getItem(k)||localStorage.getItem(k)||d}catch(e){return d}}function loadImage(src,cross){return new Promise((ok,no)=>{const i=new Image();if(cross)i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=no;i.src=src})}function fit(ctx,img,x,y,w,h){const s=Math.max(w/img.width,h/img.height),sw=w/s,sh=h/s,sx=(img.width-sw)/2,sy=(img.height-sh)/2;ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h)}function txt(ctx,t,x,y,z,w,c,m){ctx.fillStyle=c;ctx.font=w+' '+z+'px -apple-system,BlinkMacSystemFont,"Noto Sans",Arial,sans-serif';ctx.textBaseline='top';let q=t;while(ctx.measureText(q).width>m&&q.length>2)q=q.slice(0,-1);if(q!==t)q+='…';ctx.fillText(q,x,y)}async function buildCanvas(){const W=1712,H=1080,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#063d78';x.fillRect(0,0,W,518);const photo=await loadImage(get('cartaoFoto',fallback));fit(x,photo,70,58,230,350);x.strokeStyle='#c99a32';x.lineWidth=12;x.strokeRect(70,58,230,350);const org=get('cartaoOrg','宗教法人 日本クリスチャンコングレゲーション'),name=get('cartaoNome','藤社 アトス ロベルト'),title=get('cartaoCargo','管理代表役員（会長）');txt(x,org,345,95,57,'bold','#fff',1280);txt(x,'JAPAN CHRISTIAN CONGREGATION · RELIGIOUS CORPORATION',345,225,27,'normal','#fff',1250);txt(x,name,70,575,62,'bold','#142235',1200);txt(x,'Roberto Tosha',70,665,47,'bold','#063d78',1200);txt(x,title,70,730,38,'bold','#063d78',1050);txt(x,'Presidente da Administração',70,785,33,'normal','#142235',1050);txt(x,'☎ 0566 93 1383',70,850,29,'normal','#142235',1000);txt(x,'✉ CCj.secretariacentral@outlook.com',70,895,29,'normal','#142235',1050);txt(x,'〒446-0046',70,940,29,'normal','#142235',1000);txt(x,'愛知県 安城市 赤松町西下40-8',70,985,27,'normal','#142235',1050);try{const qr=await loadImage(qrUrl,true);x.fillStyle='#fff';x.fillRect(1340,600,300,380);x.strokeStyle='#c99a32';x.lineWidth=10;x.strokeRect(1340,600,300,380);x.drawImage(qr,1360,620,260,260);x.fillStyle='#063d78';x.fillRect(1360,885,260,75);txt(x,'公式サイト / PRESENÇA',1380,900,24,'bold','#fff',220)}catch(e){}return c}function jpegBytes(dataUrl){const b=atob(dataUrl.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}function pdfBytes(jpeg,content,W,H){const enc=new TextEncoder(),parts=[],offs=[];let pos=0;function add(v){const a=typeof v==='string'?enc.encode(v):v;parts.push(a);pos+=a.length}function startObj(n){offs[n]=pos;add(n+' 0 obj\n')}function endObj(){add('\nendobj\n')}add(new Uint8Array([37,80,68,70,45,49,46,51,10,37,255,255,255,255,10]));startObj(1);add('<< /Type /Catalog /Pages 2 0 R >>');endObj();startObj(2);add('<< /Type /Pages /Kids [3 0 R] /Count 1 >>');endObj();startObj(3);add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im 4 0 R >> >> /Contents 5 0 R >>');endObj();startObj(4);add('<< /Type /XObject /Subtype /Image /Width 1712 /Height 1080 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpeg.length+' >>\nstream\n');add(jpeg);add('\nendstream');endObj();startObj(5);add('<< /Length '+enc.encode(content).length+' >>\nstream\n'+content+'endstream');endObj();const xref=pos;add('xref\n0 6\n0000000000 65535 f \n');for(let i=1;i<=5;i++)add(String(offs[i]).padStart(10,'0')+' 00000 n \n');add('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');const total=parts.reduce((n,a)=>n+a.length,0),out=new Uint8Array(total);let p=0;for(const a of parts){out.set(a,p);p+=a.length}return out}function makeSinglePdf(jpeg){const W=242.6456693,H=153.0708661;return pdfBytes(jpeg,'q\n'+W+' 0 0 '+H+' 0 0 cm\n/Im Do\nQ\n',W,H)}async function prepare(){try{const c=await buildCanvas();const data=await new Promise((resolve,reject)=>c.toBlob(b=>{if(!b)return reject(new Error('Canvas vazio'));const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(b)},'image/jpeg',.95));const jpeg=jpegBytes(data);const pdf=makeSinglePdf(jpeg);const blob=new Blob([pdf],{type:'application/pdf'});pdfFile=new File([blob],'cartao-igreja-85x54mm.pdf',{type:'application/pdf'});pdfUrl=URL.createObjectURL(blob);$('preview').src=c.toDataURL('image/jpeg',.9);$('openBtn').href=pdfUrl;$('openBtn').style.pointerEvents='auto';$('openBtn').style.opacity='1';$('shareBtn').disabled=false;$('status').textContent='Pronto. Cartão individual preparado para impressão.'}catch(e){console.error(e);$('status').textContent='Erro ao criar o PDF. Tente novamente.'}}async function shareFile(){if(!pdfFile)return;try{const d={files:[pdfFile],title:'Cartão Digital — 85,6 × 54 mm'};if(navigator.share&&navigator.canShare&&navigator.canShare(d)){await navigator.share(d);return}}catch(e){if(e&&e.name==='AbortError')return}if(pdfUrl)location.href=pdfUrl}$('shareBtn').addEventListener('click',shareFile);prepare();</script></body></html>
