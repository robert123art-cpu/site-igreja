<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Cartão para impressão</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:#eef3f8;color:#142235;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans",Arial,sans-serif}body{padding:14px}.box{max-width:900px;margin:auto}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.btn{border:0;border-radius:12px;padding:13px 16px;background:#063d78;color:#fff;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer}.btn:disabled{opacity:.55}.hint{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px;line-height:1.45}.preview{background:#fff;border-radius:18px;padding:12px;box-shadow:0 10px 30px #0002}.preview img{display:block;width:100%;height:auto;border-radius:10px}.status{margin:0 0 12px;font-weight:700}@media(max-width:520px){.btn{font-size:15px;padding:12px 13px}}</style></head><body><div class="box"><div class="toolbar"><button class="btn" id="pdfBtn" type="button" disabled>📄 Gerar PDF 85,6 × 54 mm</button><button class="btn" id="shareBtn" type="button" disabled>📤 Compartilhar PDF</button><a class="btn" id="openBtn" href="#" target="_blank" rel="noopener" style="pointer-events:none;opacity:.55">🖼️ Abrir cartão</a><a class="btn" href="cartao-digital.html?v=19">↩ Voltar</a></div><div class="hint"><p class="status" id="status">Preparando o cartão...</p><span>O PDF será criado no tamanho exato de <b>85,6 × 54 mm</b>, com a fotografia incorporada. No iPhone, use <b>Compartilhar PDF</b> e escolha <b>Imprimir</b>. O PDF também pode ser salvo em Arquivos.</span></div><div class="preview"><img id="preview" alt="Cartão pronto para impressão"></div></div><script>const $=id=>document.getElementById(id);const fallback="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='600' height='800'><rect width='100%' height='100%' fill='#dbe3eb'/><text x='50%' y='48%' text-anchor='middle' font-family='Arial' font-size='34' fill='#5b6b7d'>FOTOGRAFIA</text></svg>");const qrUrl='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Frobert123art-cpu.github.io%2Fsite-igreja%2Fpresenca.html';let pngBlob=null,pdfBlob=null,pngUrl='',pdfUrl='',pdfFile=null;function get(k,def){try{return sessionStorage.getItem(k)||localStorage.getItem(k)||def}catch(e){return def}}function loadImage(src,cross){return new Promise((resolve,reject)=>{const im=new Image();if(cross)im.crossOrigin='anonymous';im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}function fitImage(ctx,img,x,y,w,h){const s=Math.max(w/img.width,h/img.height),sw=w/s,sh=h/s,sx=(img.width-sw)/2,sy=(img.height-sh)/2;ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h)}function drawText(ctx,text,x,y,size,weight,color,max){ctx.fillStyle=color;ctx.font=weight+' '+size+'px -apple-system,BlinkMacSystemFont,"Noto Sans",Arial,sans-serif';ctx.textBaseline='top';let t=text;if(ctx.measureText(t).width>max){while(t.length>1&&ctx.measureText(t+'…').width>max)t=t.slice(0,-1);t+='…'}ctx.fillText(t,x,y)}function concatBytes(parts){let n=0;for(const p of parts)n+=p.length;const out=new Uint8Array(n);let o=0;for(const p of parts){out.set(p,o);o+=p.length}return out}function makePdf(jpegBytes,W,H){const enc=new TextEncoder(),pw=243.2125984252,ph=153.0708661417;const objects=[];objects[1]=enc.encode('<< /Type /Catalog /Pages 2 0 R >>');objects[2]=enc.encode('<< /Type /Pages /Kids [3 0 R] /Count 1 >>');objects[3]=enc.encode('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');objects[4]=concatBytes([enc.encode('<< /Type /XObject /Subtype /Image /Width '+W+' /Height '+H+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpegBytes.length+' >>\nstream\n'),jpegBytes,enc.encode('\nendstream')]);const stream='q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q';objects[5]=enc.encode('<< /Length '+enc.encode(stream).length+' >>\nstream\n'+stream+'\nendstream');const header=enc.encode('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');const chunks=[header],offsets=[0],start=header.length;for(let i=1;i<=5;i++){offsets[i]=start;const b=concatBytes([enc.encode(i+' 0 obj\n'),objects[i],enc.encode('\nendobj\n')]);chunks.push(b);start+=b.length}const xref=start;let x='xref\n0 6\n0000000000 65535 f \n';for(let i=1;i<=5;i++)x+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';const trailer='trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';chunks.push(enc.encode(x+trailer));return new Blob(chunks,{type:'application/pdf'})}async function buildCard(){const W=1712,H=1080,c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#063d78';ctx.fillRect(0,0,W,518);const photo=await loadImage(get('cartaoFoto',fallback));fitImage(ctx,photo,70,58,230,350);ctx.strokeStyle='#c99a32';ctx.lineWidth=12;ctx.strokeRect(70,58,230,350);const org=get('cartaoOrg','宗教法人 日本クリスチャンコングレゲーション'),name=get('cartaoNome','藤社 アトス ロベルト'),title=get('cartaoCargo','管理代表役員（会長）');drawText(ctx,org,345,95,57,'bold','#fff',1280);drawText(ctx,'JAPAN CHRISTIAN CONGREGATION · RELIGIOUS CORPORATION',345,225,27,'normal','#fff',1250);drawText(ctx,name,70,575,62,'bold','#142235',1200);drawText(ctx,'Roberto Tosha',70,665,47,'bold','#063d78',1200);drawText(ctx,title,70,730,38,'bold','#063d78',1050);drawText(ctx,'Presidente da Administração',70,785,33,'normal','#142235',1050);drawText(ctx,'☎ 0566 93 1383',70,850,29,'normal','#142235',1000);drawText(ctx,'✉ CCj.secretariacentral@outlook.com',70,895,29,'normal','#142235',1050);drawText(ctx,'〒446-0046',70,940,29,'normal','#142235',1000);drawText(ctx,'愛知県 安城市 赤松町西下40-8',70,985,27,'normal','#142235',1050);try{const qr=await loadImage(qrUrl,true);ctx.fillStyle='#fff';ctx.fillRect(1340,600,300,380);ctx.strokeStyle='#c99a32';ctx.lineWidth=10;ctx.strokeRect(1340,600,300,380);ctx.drawImage(qr,1360,620,260,260);ctx.fillStyle='#063d78';ctx.fillRect(1360,885,260,75);drawText(ctx,'公式サイト / PRESENÇA',1380,900,24,'bold','#fff',220)}catch(e){}return c}async function prepare(){try{const c=await buildCard();pngBlob=await new Promise(r=>c.toBlob(r,'image/png'));const jpeg=await new Promise(r=>c.toBlob(r,'image/jpeg',0.96));if(!pngBlob||!jpeg)throw Error('blob');pngUrl=URL.createObjectURL(pngBlob);pdfBlob=makePdf(new Uint8Array(await jpeg.arrayBuffer()),c.width,c.height);pdfUrl=URL.createObjectURL(pdfBlob);pdfFile=new File([pdfBlob],'cartao-igreja-85x54mm.pdf',{type:'application/pdf'});$('preview').src=pngUrl;$('openBtn').href=pngUrl;$('openBtn').style.pointerEvents='auto';$('openBtn').style.opacity='1';$('pdfBtn').disabled=false;$('shareBtn').disabled=false;$('status').textContent='Cartão pronto. PDF criado em 85,6 × 54 mm com a fotografia preservada.'}catch(e){console.error(e);$('status').textContent='Não foi possível preparar o PDF. Volte e selecione a fotografia novamente.'}}$('pdfBtn').addEventListener('click',()=>{if(pdfUrl){const a=document.createElement('a');a.href=pdfUrl;a.download='cartao-igreja-85x54mm.pdf';a.click()}});$('shareBtn').addEventListener('click',async()=>{if(!pdfFile)return;try{const data={files:[pdfFile],title:'Cartão Digital — 85,6 × 54 mm'};if(navigator.share&&navigator.canShare&&navigator.canShare(data)){await navigator.share(data);return}}catch(e){if(e&&e.name==='AbortError')return}if(pdfUrl)location.href=pdfUrl});prepare();</script></body></html>
