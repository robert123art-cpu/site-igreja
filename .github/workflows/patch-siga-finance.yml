name: Atualizar Livro Caixa do SIGA

on:
  push:
    paths:
      - '.github/workflows/patch-siga-finance.yml'

permissions:
  contents: write

jobs:
  patch-finance:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Atualizar módulo Financeiro
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('siga/index.html')
          s = p.read_text(encoding='utf-8')

          old = '''<div id="finance" class="module hidden"><div class="title"><div><h1>💰 Financeiro</h1><p>Livro Caixa, receitas, despesas e saldo</p></div></div><div class="cards"><div class="card"><div class="label">Saldo</div><div class="value ok">¥ 1.250.000</div></div><div class="card"><div class="label">Entradas</div><div class="value ok">¥ 480.000</div></div><div class="card"><div class="label">Saídas</div><div class="value bad">¥ 315.000</div></div></div></div>'''

          new = '''<div id="finance" class="module hidden">
          <div class="title"><div><h1>💰 Financeiro / 財務</h1><p>Livro Caixa, lançamentos e saldo automático</p></div><button class="btn primary" type="button" onclick="loadFinance()">↻ Atualizar</button></div>
          <div class="cards" id="financeCards"><div class="card"><div class="label">Saldo atual</div><div class="value" id="finBalance">¥ 0</div><div class="sub">Caixa + bancos</div></div><div class="card"><div class="label">Entradas do mês</div><div class="value ok" id="finEntries">¥ 0</div><div class="sub">Receitas</div></div><div class="card"><div class="label">Saídas do mês</div><div class="value bad" id="finExpenses">¥ 0</div><div class="sub">Despesas</div></div><div class="card"><div class="label">Resultado</div><div class="value" id="finResult">¥ 0</div><div class="sub">Entradas − saídas</div></div></div>
          <div class="grid2">
            <div class="panel"><h2>Novo lançamento / 新規取引</h2><form id="financeForm" onsubmit="saveFinance(event)"><div class="formgrid"><label>Unidade / 拠点<select id="fUnit" required></select></label><label>Conta financeira / 金融口座<select id="fAccount" required></select></label><label>Conta do Plano / 勘定科目<select id="fChart" required></select></label><label>Tipo / 種類<select id="fType"><option value="entry">Entrada / 収入</option><option value="expense">Saída / 支出</option></select></label><label>Data / 日付<input id="fDate" type="date" required></label><label>Valor / 金額<input id="fAmount" type="number" min="0.01" step="0.01" required></label><label>Documento / 証憑<input id="fDoc"></label><label>Favorecido / 相手先<input id="fCounterparty"></label><label style="grid-column:1/-1">Descrição / 摘要<input id="fDescription" required></label></div><div class="actions"><button type="submit" class="btn primary">Salvar / 保存</button><button type="button" class="btn secondary" onclick="document.getElementById('financeForm').reset();setFinanceDate()">Limpar / クリア</button></div></form></div>
            <div class="panel"><h2>Livro Caixa / 現金出納帳</h2><div class="toolbar"><input id="financeSearch" placeholder="Pesquisar descrição..." oninput="renderFinance()"><button type="button" class="btn secondary" onclick="exportFinanceCsv()">Exportar CSV</button></div><div class="tablewrap"><table><thead><tr><th>Data</th><th>Unidade</th><th>Descrição</th><th>Tipo</th><th>Valor</th></tr></thead><tbody id="financeTable"></tbody></table></div></div>
          </div>
        </div>'''

          if old not in s:
              raise SystemExit('Bloco Financeiro esperado não encontrado; nenhuma alteração feita.')
          s = s.replace(old, new, 1)

          marker = "if(id==='units')loadUnits();"
          replacement = "if(id==='finance'&&typeof loadFinance==='function')loadFinance();" + marker
          if marker in s and "if(id==='finance'&&typeof loadFinance==='function')loadFinance();" not in s:
              s = s.replace(marker, replacement, 1)

          finance_js = r'''
<script>
async function loadFinance(){
  try{
    const {data:units,error:ue}=await authClient.from('siga_units').select('id,code,name,japanese_name').eq('is_active',true).order('code');
    if(ue) throw ue;
    const {data:accounts,error:ae}=await authClient.from('siga_financial_accounts').select('id,unit_id,name,account_type,currency_code').eq('is_active',true).order('name');
    if(ae) throw ae;
    const {data:charts,error:ce}=await authClient.from('siga_chart_of_accounts').select('id,code,name_pt,name_ja,account_kind').eq('is_active',true).order('code');
    if(ce) throw ce;
    const u=document.getElementById('fUnit'),a=document.getElementById('fAccount'),c=document.getElementById('fChart');
    u.innerHTML='<option value="">Selecione / 選択</option>'+(units||[]).map(x=>'<option value="'+x.id+'">'+(x.code||'')+' — '+(x.name||'')+(x.japanese_name?' / '+x.japanese_name:'')+'</option>').join('');
    a.innerHTML='<option value="">Selecione / 選択</option>'+(accounts||[]).map(x=>'<option value="'+x.id+'" data-unit="'+x.unit_id+'">'+(x.name||'')+' — '+(x.account_type||'')+' ('+(x.currency_code||'')+')</option>').join('');
    c.innerHTML='<option value="">Selecione / 選択</option>'+(charts||[]).map(x=>'<option value="'+x.id+'">'+x.code+' — '+(x.name_ja||'')+' / '+(x.name_pt||'')+(x.account_kind==='synthetic'?' [grupo]':'')+'</option>').join('');
    u.onchange=filterFinanceAccounts;
    filterFinanceAccounts();
    setFinanceDate();
    await renderFinance();
  }catch(e){console.error(e);alert('Não foi possível carregar o financeiro: '+(e.message||e));}
}
function filterFinanceAccounts(){const uid=document.getElementById('fUnit')?.value||'';document.querySelectorAll('#fAccount option').forEach((o,i)=>{if(i===0)return;o.hidden=!!uid&&o.dataset.unit!==uid;});}
function setFinanceDate(){const d=document.getElementById('fDate');if(d&&!d.value)d.value=new Date().toISOString().slice(0,10);}
async function saveFinance(ev){
 ev.preventDefault();
 try{
  const payload={unit_id:document.getElementById('fUnit').value,financial_account_id:document.getElementById('fAccount').value,chart_account_id:document.getElementById('fChart').value,transaction_date:document.getElementById('fDate').value,transaction_type:document.getElementById('fType').value,amount:Number(document.getElementById('fAmount').value),description:document.getElementById('fDescription').value.trim(),document_number:document.getElementById('fDoc').value.trim()||null,counterparty:document.getElementById('fCounterparty').value.trim()||null};
  const {error}=await authClient.from('siga_financial_transactions').insert(payload);
  if(error)throw error;
  alert('Lançamento salvo / 取引を保存しました');
  document.getElementById('financeForm').reset();setFinanceDate();await renderFinance();
 }catch(e){console.error(e);alert('Não foi possível salvar: '+(e.message||e));}
}
async function renderFinance(){
 try{
  const {data,error}=await authClient.from('siga_financial_transactions').select('transaction_date,description,transaction_type,amount,unit_id,siga_units(code,name)').order('transaction_date',{ascending:false}).limit(100);
  if(error)throw error;
  const rows=data||[],q=(document.getElementById('financeSearch')?.value||'').toLowerCase();
  document.getElementById('financeTable').innerHTML=rows.filter(x=>(x.description||'').toLowerCase().includes(q)).map(x=>'<tr><td>'+new Date(x.transaction_date+'T00:00:00').toLocaleDateString('pt-BR')+'</td><td>'+((x.siga_units?.code||'')+' '+(x.siga_units?.name||''))+'</td><td>'+esc(x.description)+'</td><td class="'+(x.transaction_type==='entry'?'ok':'bad')+'">'+(x.transaction_type==='entry'?'Entrada':'Saída')+'</td><td class="'+(x.transaction_type==='entry'?'ok':'bad')+'">'+money(x.amount)+'</td></tr>').join('')||'<tr><td colspan="5">Nenhum lançamento.</td></tr>';
  const entries=rows.filter(x=>x.transaction_type==='entry').reduce((s,x)=>s+Number(x.amount),0),expenses=rows.filter(x=>x.transaction_type==='expense').reduce((s,x)=>s+Number(x.amount),0);
  document.getElementById('finEntries').textContent=money(entries);document.getElementById('finExpenses').textContent=money(expenses);document.getElementById('finResult').textContent=money(entries-expenses);document.getElementById('finBalance').textContent=money(entries-expenses);
 }catch(e){console.error(e);const t=document.getElementById('financeTable');if(t)t.innerHTML='<tr><td colspan="5">Não foi possível carregar os lançamentos.</td></tr>';}
}
function money(v){return new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Number(v)||0)}
function exportFinanceCsv(){const rows=[['Data','Unidade','Descrição','Tipo','Valor'],...Array.from(document.querySelectorAll('#financeTable tr')).map(tr=>Array.from(tr.cells).map(td=>td.innerText))];const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='SIGA_Livro_Caixa.csv';a.click();}
document.addEventListener('DOMContentLoaded',()=>{setFinanceDate();});
</script>
'''

          if 'async function loadFinance()' not in s:
              s = s.replace('</body>', finance_js + '</body>', 1)

          p.write_text(s,encoding='utf-8')

      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add siga/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Ativar Livro Caixa no SIGA"
          git push
