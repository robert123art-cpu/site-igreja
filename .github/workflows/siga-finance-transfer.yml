name: Verificar transferências do SIGA

on:
  workflow_dispatch:
  push:
    paths:
      - 'siga/index.html'

permissions:
  contents: read

jobs:
  validate-transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Verificar formulário e gravação
        shell: python {0}
        run: |
          from pathlib import Path

          source = Path('siga/index.html').read_text(encoding='utf-8')
          checks = {
              'opção Transferência': '<option value="transfer">Transferência / 振替</option>' in source,
              'campo de destino no formulário': '<select id="fTargetAccount">' in source,
              'contas da mesma unidade': ".eq('unit_id',unitId).eq('is_active',true)" in source,
              'destino obrigatório': 'if(target)target.required=isTransfer;' in source,
              'tipo transfer gravado': "transaction_type:isTransfer?'transfer':type" in source,
              'destino gravado': 'transfer_target_account_id:isTransfer?(target.value||null):null' in source,
              'conta do Plano nula': 'chart_account_id:isTransfer?null:(chart.value||null)' in source,
              'patch sobreposto removido': 'siga-transfer-live-patch' not in source,
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit('Verificação falhou: ' + ', '.join(failed))
          print('Formulário, filtro por unidade e payload de transferência verificados.')
