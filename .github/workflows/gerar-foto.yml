name: Gerar fotografia do cartao
on:
  push:
    paths:
      - 'cartao-foto.txt'
      - '.github/workflows/gerar-foto.yml'
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Converter base64 para JPEG
        run: base64 -d cartao-foto.txt > cartao-foto.jpg
      - name: Publicar JPEG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cartao-foto.jpg
          git diff --cached --quiet || git commit -m 'Adicionar fotografia do cartao'
          git push
