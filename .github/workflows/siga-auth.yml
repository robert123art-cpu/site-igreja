name: Enable SIGA Supabase Auth

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-siga-auth:
    if: ${{ !contains(github.event.head_commit.message, '[siga-auth]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch SIGA authentication
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('siga/index.html')
          s = p.read_text(encoding='utf-8')

          if 'cdn.jsdelivr.net/npm/@supabase/supabase-js@2' not in s:
              s = s.replace('</head>', '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n</head>', 1)

          start = s.index('<div id="admin" class="module hidden">')
          end = s.index('</section></main>', start)
          admin = '''<div id="admin" class="module hidden"><div class="title"><div><h1>🔐 Administração</h1><p>Usuários, permissões e segurança</p></div><button type="button" class="btn primary" onclick="openLogin()">🔑 Entrar</button></div>
          <div class="admin-grid"><div class="panel"><h2>🔐 Conta de acesso</h2><p class="small-note">O SIGA agora usa o <b>Supabase Auth</b> para autenticação real. A senha não fica armazenada no navegador.</p><div class="field"><label>E-mail da sessão</label><input id="sessionEmail" readonly></div><div class="field" style="margin-top:10px"><label>Status</label><input id="sessionStatus" readonly></div><div class="actions"><button type="button" class="btn secondary" onclick="requestPasswordRecovery()">↻ Recuperar / alterar senha</button><button type="button" class="btn danger" onclick="signOutSIGA()">Sair do SIGA</button></div></div>
          <div class="panel"><h2>👥 Usuários e permissões</h2><p class="small-note">A próxima etapa vai criar os perfis <b>Administrador, Presidente, Tesouraria, Secretaria, Patrimônio e Usuário comum</b> e controlar o que cada perfil pode acessar.</p><div class="actions"><button type="button" class="btn secondary" onclick="alert('Módulo de permissões será ativado na próxima etapa.')">Configurar permissões</button></div></div></div>
          <div class="panel" style="margin-top:17px"><h2>🛡️ Segurança</h2><p id="securityMsg" class="small-note">Login protegido por Supabase Auth. A recuperação de senha usa um link seguro enviado por e-mail.</p><div class="actions"><button type="button" class="btn secondary" onclick="requestPasswordRecovery()">📧 Enviar link de recuperação</button></div></div></div>
          <div id="loginModal" class="modal hidden"><div class="modal-box"><h2>🔐 Acesso ao SIGA</h2><p class="small-note">Entre com seu e-mail e senha cadastrados.</p><div class="field"><label>E-mail</label><input id="loginUser" type="email" autocomplete="email" inputmode="email"></div><div class="field" style="margin-top:10px"><label>Senha</label><input id="loginPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter'){event.preventDefault();login();}"></div><div class="actions"><button id="loginSubmit" type="button" class="btn primary" onclick="login()">Entrar</button><button type="button" class="btn secondary" onclick="requestPasswordRecovery()">Esqueci minha senha</button></div><div id="loginMsg" class="login-msg"></div></div></div>\n          '''
          s = s[:start] + admin + '</section></main>' + s[end+len('</section></main>'):]

          astart = s.find("const SUPABASE_URL='")
          aend = s.find('let members=', astart) if astart >= 0 else -1
          if astart >= 0 and aend > astart:
              auth = '''const SUPABASE_URL='https://uoapmjwdwtpltnxvmniy.supabase.co';
          const SUPABASE_KEY='sb_publishable_10fUBHTtp6sev9kXjMIDJg_CFBkeT8D';
          const SIGA_RESET_URL='https://robert123art-cpu.github.io/site-igreja/redefinir-senha.html';
          const authClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
          let sigaSession=null;
          function setUserHeader(user){const box=document.querySelector('.user');if(!box)return;if(!user){box.innerHTML='Acesso necessário <div class="avatar">🔐</div>';return}const label=user.email||'Usuário';const initials=label.slice(0,2).toUpperCase();box.innerHTML='<span>'+escapeHtml(label)+'</span><button type="button" class="btn secondary" style="padding:7px 10px;min-height:36px" onclick="signOutSIGA()">Sair</button><div class="avatar">'+escapeHtml(initials)+'</div>';}
          function updateSessionUI(){const email=document.getElementById('sessionEmail'),status=document.getElementById('sessionStatus');if(email)email.value=sigaSession?.user?.email||'';if(status)status.value=sigaSession?'Autenticado':'Não autenticado';setUserHeader(sigaSession?.user||null);}
          async function requireSession(){try{const {data,error}=await authClient.auth.getSession();if(error)throw error;sigaSession=data.session;updateSessionUI();if(!sigaSession)openLogin();}catch(e){console.error(e);openLogin('Não foi possível verificar o acesso. Tente novamente.');}}
          async function login(){const btn=document.getElementById('loginSubmit'),email=document.getElementById('loginUser').value.trim(),password=document.getElementById('loginPass').value,msg=document.getElementById('loginMsg');msg.textContent='';if(!email||!password){msg.textContent='Informe o e-mail e a senha.';return}if(btn){btn.disabled=true;btn.textContent='Entrando...';}try{const {data,error}=await authClient.auth.signInWithPassword({email,password});if(error)throw error;sigaSession=data.session;updateSessionUI();closeLogin();document.getElementById('loginPass').value='';}catch(e){console.error(e);msg.textContent='Não foi possível entrar. Verifique o e-mail e a senha.';}finally{if(btn){btn.disabled=false;btn.textContent='Entrar';}}}
          function openLogin(message=''){const modal=document.getElementById('loginModal');if(!modal)return;modal.classList.remove('hidden');const msg=document.getElementById('loginMsg');if(msg)msg.textContent=message||'';setTimeout(()=>document.getElementById('loginUser')?.focus(),50)}
          function closeLogin(){if(sigaSession)document.getElementById('loginModal')?.classList.add('hidden')}
          async function signOutSIGA(){await authClient.auth.signOut();sigaSession=null;updateSessionUI();openLogin('Sessão encerrada. Entre novamente para acessar o SIGA.')}
          async function requestPasswordRecovery(){const email=(document.getElementById('loginUser')?.value||'').trim();if(!email){alert('Digite primeiro o e-mail cadastrado no SIGA.');document.getElementById('loginUser')?.focus();return}const {error}=await authClient.auth.resetPasswordForEmail(email,{redirectTo:SIGA_RESET_URL});if(error){alert('Não foi possível enviar o link de recuperação: '+error.message);return}alert('Link de recuperação enviado. Verifique seu e-mail e a pasta Spam/Lixo eletrônico.')}
          authClient.auth.onAuthStateChange((_event,session)=>{sigaSession=session;updateSessionUI();if(session)document.getElementById('loginModal')?.classList.add('hidden')});
          '''
              s = s[:astart] + auth + s[aend:]

          s = s.replace("applySettings();});", "applySettings();requireSession();});", 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit SIGA auth changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add siga/index.html
          git diff --cached --quiet && exit 0
          git commit -m "[siga-auth] Repair SIGA login and recovery"
          git push

# Mobile login button repair: explicit type=button, visible loading/error state, and Supabase Auth.
