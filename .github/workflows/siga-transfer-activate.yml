name: Ativar Transferencia do SIGA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/siga-transfer-activate.yml'

permissions:
  contents: write

jobs:
  patch-transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Corrigir transferencia no Financeiro
        shell: python {0}
        run: |
          from pathlib import Path

          p = Path('siga/index.html')
          s = p.read_text(encoding='utf-8')

          old = "const targetLabel=target.closest('label');\n              if(targetLabel)targetLabel.style.display=transfer?'':'';"
          new = "const targetLabel=target.closest('label');\n              if(targetLabel){targetLabel.hidden=!transfer;targetLabel.style.display=transfer?'':'none';}\n              target.hidden=!transfer;"

          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
              print('Visibilidade do campo de destino corrigida.')
          elif 'target.hidden=!transfer;' in s:
              print('Correcao de visibilidade ja instalada.')
          else:
              raise SystemExit('Trecho da transferencia nao encontrado.')

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add siga/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir visibilidade da conta de destino [skip ci]"
          git push
