name: Ativar Transferencia do SIGA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/siga-transfer-activate.yml'

permissions:
  contents: write

jobs:
  patch-transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Corrigir transferencia no Financeiro
        shell: python {0}
        run: |
          from pathlib import Path
          import re

          p = Path('siga/index.html')
          s = p.read_text(encoding='utf-8')

          marker = "const transfer=type.value==='transfer';"
          if marker in s and 'const transferField=document.getElementById(\'fTransferField\');' not in s:
              replacement = marker + "\n              const transferField=document.getElementById('fTransferField');\n              if(transferField)transferField.style.display=transfer?'':'none';"
              s = s.replace(marker, replacement, 1)
              p.write_text(s, encoding='utf-8')
              print('Ocultacao automatica da conta de destino instalada.')
          elif 'const transferField=document.getElementById(\'fTransferField\');' in s:
              print('Correcao ja instalada.')
          else:
              raise SystemExit('Ponto da transferencia nao encontrado.')

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add siga/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir ocultacao da conta de destino [skip ci]"
          git push
