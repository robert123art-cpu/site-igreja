<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Cartão Digital — Japan Christian Congregation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans",Arial,sans-serif;background:#eef3f8;color:#142235}.wrap{width:100%;max-width:760px;margin:auto;padding:14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar button{background:#063d78;color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:16px}.business-card{width:100%;aspect-ratio:1.586/1;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 10px 30px #0002;display:grid;grid-template-rows:46% 54%;position:relative}.card-top{min-height:0;overflow:hidden;background:#063d78;color:#fff;display:grid;grid-template-columns:30% minmax(0,70%);align-items:center;padding:4% 4%;gap:3%}.photo{display:block;width:100%;height:84%;object-fit:cover;object-position:center;border:4px solid #c99a32;border-radius:9px;background:#dbe3eb}.card-head{min-width:0;overflow:hidden}.org{font-size:clamp(13px,2.8vw,22px);line-height:1.14;font-weight:800;overflow-wrap:anywhere;word-break:break-word}.sub{font-size:clamp(7px,1.35vw,12px);line-height:1.2;margin-top:6px;overflow-wrap:anywhere}.card-body{min-width:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 18%;gap:3%;padding:4% 4%;align-items:center}.identity{min-width:0;overflow:hidden}.name{font-size:clamp(15px,3.4vw,25px);line-height:1.08;font-weight:800;overflow-wrap:anywhere}.en{color:#063d78;font-size:clamp(13px,2.7vw,20px);line-height:1.1;font-weight:800;margin-top:4px}.title{color:#063d78;font-size:clamp(10px,2vw,15px);line-height:1.1;font-weight:800;margin-top:7px;overflow-wrap:anywhere}.pt-title{font-size:clamp(9px,1.75vw,14px);line-height:1.1;margin-top:3px;overflow-wrap:anywhere}.contacts{font-size:clamp(7px,1.4vw,11px);line-height:1.28;margin-top:7px;overflow-wrap:anywhere}.qrbox{width:100%;max-width:76px;justify-self:end;background:#fff;border:2px solid #c99a32;padding:3px;border-radius:6px;overflow:hidden}.qrbox img{display:block;width:100%;height:auto}.qrbox small{display:block;background:#063d78;color:#fff;text-align:center;font-size:clamp(6px,1.15vw,9px);line-height:1.1;padding:3px 1px;white-space:normal}.panel{background:#fff;border-radius:18px;padding:18px;margin-top:18px}.panel input{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #ccd5df;border-radius:9px;font:inherit}.panel button{background:#063d78;color:#fff;border:0;border-radius:10px;padding:11px 14px;font-weight:700}@media(max-width:520px){.wrap{padding:12px}.business-card{border-radius:14px}.card-top{grid-template-columns:29% minmax(0,71%);padding:4% 3.5%;gap:3%}.photo{border-width:3px}.card-body{grid-template-columns:minmax(0,1fr) 18%;padding:4% 3.5%;gap:3%}.qrbox{max-width:70px}}

/* Impressão: uma única frente no tamanho padrão de cartão de visita */
@page{size:85.6mm 54mm;margin:0}
@media print{
 html,body{width:85.6mm!important;height:54mm!important;margin:0!important;padding:0!important;background:#fff!important;overflow:hidden!important}
 .wrap{width:85.6mm!important;height:54mm!important;max-width:none!important;margin:0!important;padding:0!important}
 .toolbar,.panel{display:none!important}
 .business-card{display:grid!important;width:85.6mm!important;height:54mm!important;aspect-ratio:auto!important;margin:0!important;padding:0!important;border-radius:0!important;box-shadow:none!important;overflow:hidden!important;grid-template-rows:46% 54%!important;break-inside:avoid!important;page-break-inside:avoid!important}
 .card-top{height:auto!important;padding:2.8mm 3mm!important;gap:2.5mm!important;grid-template-columns:29% minmax(0,1fr)!important}
 .photo{height:88%!important;border:0.8mm solid #c99a32!important;border-radius:1.5mm!important}
 .org{font-size:3.55mm!important;line-height:1.08!important}
 .sub{font-size:1.85mm!important;line-height:1.08!important;margin-top:1mm!important}
 .card-body{height:auto!important;padding:2.7mm 3mm!important;gap:2.5mm!important;grid-template-columns:minmax(0,1fr) 20%!important}
 .name{font-size:4.0mm!important;line-height:1.04!important}.en{font-size:3.2mm!important;line-height:1.04!important;margin-top:.8mm!important}.title{font-size:2.35mm!important;line-height:1.04!important;margin-top:1mm!important}.pt-title{font-size:2.15mm!important;line-height:1.04!important;margin-top:.6mm!important}.contacts{font-size:1.65mm!important;line-height:1.18!important;margin-top:1.1mm!important}
 .qrbox{max-width:none!important;width:100%!important;padding:.8mm!important;border:.45mm solid #c99a32!important;border-radius:.8mm!important}.qrbox small{font-size:1.35mm!important;line-height:1.05!important;padding:.5mm .2mm!important}
}
</style>
</head>
<body>
<div class="wrap">
<div class="toolbar"><button type="button" id="photoBtn">📷 Trocar fotografia</button><input id="photoFile" type="file" accept="image/*" hidden><button type="button" onclick="window.print()">🖨️ Imprimir / PDF</button></div>
<div class="business-card">
<div class="card-top"><img id="photo" class="photo" alt="Fotografia"><div class="card-head"><div class="org">宗教法人 日本クリスチャンコングレゲーション</div><div class="sub">JAPAN CHRISTIAN CONGREGATION · RELIGIOUS CORPORATION</div></div></div>
<div class="card-body"><div class="identity"><div class="name">アトス ロベルト 藤社</div><div class="en">Roberto Tosha</div><div class="title">管理代表役員（会長）</div><div class="pt-title">Presidente da Administração</div><div class="contacts">☎ 0566 93 1383<br>✉ CCj.secretariacentral@outlook.com<br>〒446-0046<br>愛知県 安城市 赤松町西下40-8</div></div><div class="qrbox"><img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Frobert123art-cpu.github.io%2Fsite-igreja%2F" alt="QR Code"><small>公式サイト / PRESENÇA</small></div></div>
</div>
<div class="panel"><h2>Cartão digital</h2><label>Organização<input id="org" value="宗教法人 日本クリスチャンコングレゲーション"></label><label>Nome<input id="name" value="アトス ロベルト 藤社"></label><label>Cargo<input id="title" value="管理代表役員（会長）"></label><button type="button" id="saveBtn">💾 Salvar dados</button></div>
</div>
<script>
const $=id=>document.getElementById(id);const fallback="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='600' height='800'><rect width='100%' height='100%' fill='#dbe3eb'/><text x='50%' y='48%' text-anchor='middle' font-family='Arial' font-size='34' fill='#5b6b7d'>FOTOGRAFIA</text></svg>");try{$('photo').src=localStorage.getItem('cartaoFoto')||fallback}catch(e){$('photo').src=fallback}$('photoBtn').addEventListener('click',()=>$('photoFile').click());$('photoFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('Selecione uma fotografia válida.');return}const r=new FileReader();r.onload=()=>{$('photo').src=r.result;try{localStorage.setItem('cartaoFoto',r.result)}catch(err){alert('A foto foi carregada, mas não pôde ser salva neste dispositivo.')}};r.onerror=()=>alert('Não foi possível carregar a fotografia.');r.readAsDataURL(f)});$('saveBtn').addEventListener('click',()=>{try{localStorage.setItem('cartaoOrg',$('org').value);localStorage.setItem('cartaoNome',$('name').value);localStorage.setItem('cartaoCargo',$('title').value);alert('Dados salvos.')}catch(e){alert('Não foi possível salvar os dados.')}});
</script>
</body>
</html>
