<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>Cartão Digital — Japan Christian Congregation</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans",Arial,sans-serif;background:#eef3f8;color:#142235}.wrap{max-width:900px;margin:auto;padding:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar button{background:#063d78;color:#fff;border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px}.card{aspect-ratio:1.586/1;border-radius:18px;overflow:hidden;background:#fff;position:relative;box-shadow:0 10px 30px #0002}.top{height:38%;background:#063d78;color:#fff;padding:20px 25px 10px 34%}.photo{position:absolute;left:3%;top:8%;width:29%;height:78%;border:4px solid #c99a32;border-radius:8px;object-fit:cover;background:#dbe3eb}.body{height:62%;padding:13px 4% 10px 34%;position:relative}.org{font-size:clamp(15px,3vw,28px);font-weight:800}.sub{font-size:clamp(9px,1.5vw,15px);margin-top:6px}.name{font-size:clamp(18px,4vw,34px);font-weight:800}.en{color:#063d78;font-weight:700}.title{color:#063d78;font-weight:700;margin-top:5px}.contacts{margin-top:8px;font-size:clamp(9px,1.5vw,14px)}.qr{position:absolute;right:3%;bottom:8%;width:18%;background:#fff;border:2px solid #c99a32;padding:5px}.qr img{width:100%}.qr small{display:block;background:#063d78;color:#fff;text-align:center;padding:4px}.panel{background:#fff;border-radius:18px;padding:18px;margin-top:18px}.panel input,.panel textarea{width:100%;box-sizing:border-box;padding:11px;margin:5px 0 10px;border:1px solid #ccd5df;border-radius:9px;font:inherit}.panel button{background:#063d78;color:#fff;border:0;border-radius:10px;padding:11px 14px;font-weight:700}@media(max-width:600px){.card{width:100%}}@media print{.toolbar,.panel{display:none}.wrap{padding:0}.card{box-shadow:none}}</style></head><body><div class="wrap"><div class="toolbar"><button type="button" id="photoBtn">📷 Trocar fotografia</button><input id="photoFile" type="file" accept="image/*" hidden><button type="button" onclick="window.print()">🖨️ Imprimir / PDF</button></div><div class="card"><img id="photo" class="photo" alt="Fotografia"><div class="top"><div class="org">宗教法人 日本クリスチャンコングレゲーション</div><div class="sub">JAPAN CHRISTIAN CONGREGATION · RELIGIOUS CORPORATION</div></div><div class="body"><div class="name">アトス ロベルト 藤社</div><div class="en">Roberto Tosha</div><div class="title">管理代表役員（会長）</div><div>Presidente da Administração</div><div class="contacts">☎ 0566 93 1383<br>✉ CCj.secretariacentral@outlook.com<br>〒446-0046<br>愛知県 安城市 赤松町西下40-8</div><div class="qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Frobert123art-cpu.github.io%2Fsite-igreja%2F" alt="QR Code"><small>公式サイト / PRESENÇA</small></div></div></div><div class="panel"><h2>Cartão digital</h2><label>Organização<input id="org" value="宗教法人 日本クリスチャンコングレゲーション"></label><label>Nome<input id="name" value="アトス ロベルト 藤社"></label><label>Cargo<input id="title" value="管理代表役員（会長）"></label><button type="button" id="saveBtn">💾 Salvar dados</button></div></div><script>const $=id=>document.getElementById(id);const fallback="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='600' height='800'><rect width='100%' height='100%' fill='#dbe3eb'/><text x='50%' y='48%' text-anchor='middle' font-family='Arial' font-size='34' fill='#5b6b7d'>FOTOGRAFIA</text></svg>");try{$('photo').src=localStorage.getItem('cartaoFoto')||fallback}catch(e){$('photo').src=fallback}$('photoBtn').addEventListener('click',()=>{$('photoFile').click()});$('photoFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('Selecione uma fotografia válida.');return}const r=new FileReader();r.onload=()=>{$('photo').src=r.result;try{localStorage.setItem('cartaoFoto',r.result)}catch(err){alert('A foto foi carregada, mas não pôde ser salva neste dispositivo.')}};r.onerror=()=>alert('Não foi possível carregar a fotografia.');r.readAsDataURL(f)});$('saveBtn').addEventListener('click',()=>{try{localStorage.setItem('cartaoOrg',$('org').value);localStorage.setItem('cartaoNome',$('name').value);localStorage.setItem('cartaoCargo',$('title').value);alert('Dados salvos.')}catch(e){alert('Não foi possível salvar os dados.')}});</script></body></html>
