<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cartão Digital — Atos Roberto Tosha</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#eef3f8;color:#142235;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans",Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;border:0;border-radius:12px;padding:13px 16px;background:#063d78;color:#fff;font-weight:800;font-size:16px;cursor:pointer;min-height:52px}.btn.secondary{background:#fff;color:#063d78;border:2px solid #cbd5df}.photoPicker{position:relative;display:inline-flex}.photoPicker input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.business-card{width:100%;max-width:856px;margin:auto;aspect-ratio:856/540;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 10px 30px #0002;display:flex;flex-direction:column}.card-top{flex:0 0 48%;background:#063d78;color:#fff;display:flex;align-items:center;padding:4%;gap:4%;overflow:hidden}.photo-frame{height:88%;aspect-ratio:3/4;flex:0 0 auto;border:4px solid #c99a32;border-radius:10px;background:#dbe3eb;overflow:hidden}.photo{width:100%;height:100%;object-fit:cover}.card-head{min-width:0;flex:1}.org{font-size:clamp(16px,3vw,27px);line-height:1.16;font-weight:800;overflow-wrap:anywhere}.sub{font-size:clamp(8px,1.35vw,12px);margin-top:7px}.card-body{flex:0 0 52%;display:flex;align-items:center;gap:4%;padding:3.5%;overflow:hidden}.identity{min-width:0;flex:1}.name{font-size:clamp(17px,3.2vw,30px);line-height:1.02;font-weight:800;overflow-wrap:anywhere}.en{color:#063d78;font-size:clamp(13px,2.5vw,21px);font-weight:800;margin-top:4px}.title{color:#063d78;font-size:clamp(10px,1.8vw,16px);font-weight:800;margin-top:6px}.pt-title{font-size:clamp(9px,1.6vw,14px);margin-top:3px}.contacts{font-size:clamp(7px,1.3vw,12px);line-height:1.25;margin-top:6px;overflow-wrap:anywhere}.qrbox{flex:0 0 18%;max-width:120px;min-width:74px;border:2px solid #c99a32;padding:5px;border-radius:8px;overflow:hidden}.qrbox img{display:block;width:100%}.qrbox small{display:block;background:#063d78;color:#fff;text-align:center;font-size:clamp(7px,1.1vw,10px);padding:4px 2px}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.actions .btn{min-height:56px;font-size:17px}.status{min-height:28px;text-align:center;margin:10px 0;color:#555;font-size:14px}.panel{display:none;background:#fff;border-radius:18px;padding:18px;margin-top:18px;box-shadow:0 4px 16px #0001}.panel.open{display:block}.panel label{display:block;font-weight:700;margin-top:10px}.panel input{width:100%;padding:12px;margin:5px 0 2px;border:1px solid #ccd5df;border-radius:9px;font:inherit}.panel .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.panel button{margin-top:12px;background:#063d78;color:#fff;border:0;border-radius:10px;padding:12px 14px;font-weight:700}@media(max-width:520px){.wrap{padding:12px}.toolbar .btn{width:100%}.photoPicker{width:100%}.photoPicker .btn{width:100%}.photo-frame{height:82%;border-width:3px}.org{font-size:clamp(13px,4.1vw,20px)}.sub{font-size:clamp(7px,1.8vw,10px)}.name{font-size:clamp(13px,3.9vw,23px)}.en{font-size:clamp(10px,3vw,17px)}.title{font-size:clamp(8px,2.4vw,13px)}.pt-title{font-size:clamp(7px,2.1vw,12px)}.contacts{font-size:clamp(6.5px,1.8vw,10px)}.qrbox{flex-basis:19%;min-width:58px;padding:3px}.actions{grid-template-columns:1fr}.panel .row{grid-template-columns:1fr}}@media print{.toolbar,.actions,.panel,.status{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
<div class="toolbar">
<button class="btn" id="editBtn" type="button">✏️ Editar cartão</button>
<div class="photoPicker"><button class="btn" type="button">📷 Trocar fotografia</button><input id="photoFile" type="file" accept="image/*"></div>
<a class="btn" href="cartao-impressao.html?v=10&modo=single">🖨️ Cartão para impressão</a>
</div>
<div class="business-card">
<div class="card-top"><div class="photo-frame"><img id="photo" class="photo" alt="Fotografia"></div><div class="card-head"><div id="orgView" class="org">宗教法人日本 クリスチャンコングレゲーション</div><div class="sub">CONGREGAÇÃO CRISTÃ NO JAPÃO</div></div></div>
<div class="card-body"><div class="identity"><div id="nameJpView" class="name">藤社アトス ロベルト</div><div id="namePtView" class="en">Atos Roberto Tosha</div><div id="titleJpView" class="title">管理代表役員（会長）</div><div id="titlePtView" class="pt-title">Presidente</div><div id="contactsView" class="contacts">☎ 0566 93 1383<br>✉ CCj.secretariacentral@outlook.com<br>〒446-0046 愛知県 安城市 赤松町西下40-8</div></div><div class="qrbox"><img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Frobert123art-cpu.github.io%2Fsite-igreja%2Fcartao-digital.html" alt="QR Code do cartão digital"><small>連絡先 / CONTATO</small></div></div>
</div>
<div class="actions">
<a class="btn" id="callBtn" href="tel:+81566931383">📞 Ligar</a>
<a class="btn" id="emailBtn" href="mailto:CCj.secretariacentral@outlook.com?subject=Contato%20-%20Atos%20Roberto%20Tosha">✉️ E-mail</a>
<button class="btn" id="contactBtn" type="button">👤 Adicionar contato</button>
<a class="btn" href="index.html">🌐 Abrir site</a>
<button class="btn secondary" id="copyBtn" type="button">📋 Copiar contato</button>
<button class="btn secondary" id="shareBtn" type="button">📤 Compartilhar</button>
<a class="btn" href="presenca.html">📋 Lista de presença</a>
</div>
<div id="status" class="status"></div>
<div id="panel" class="panel">
<h2>✏️ Editar cartão</h2>
<label>Organização em japonês<input id="org" value="宗教法人日本 クリスチャンコングレゲーション"></label>
<label>Nome em japonês<input id="nameJp" value="藤社アトス ロベルト"></label>
<label>Nome em português<input id="namePt" value="Atos Roberto Tosha"></label>
<div class="row"><label>Cargo em japonês<input id="titleJp" value="管理代表役員（会長）"></label><label>Cargo em português<input id="titlePt" value="Presidente"></label></div>
<div class="row"><label>Telefone<input id="phone" value="0566 93 1383"></label><label>E-mail<input id="email" value="CCj.secretariacentral@outlook.com"></label></div>
<label>Endereço<input id="address" value="〒446-0046 愛知県 安城市 赤松町西下40-8"></label>
<button id="saveBtn" type="button">💾 Salvar alterações</button>
<button id="translateBtn" type="button">🔄 Traduzir cargo para japonês</button>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const cardUrl='https://robert123art-cpu.github.io/site-igreja/cartao-digital.html';
const fallback="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='600' height='800'><rect width='100%' height='100%' fill='#dbe3eb'/><text x='50%' y='48%' text-anchor='middle' font-family='Arial' font-size='34' fill='#5b6b7d'>FOTOGRAFIA</text></svg>");
const defaults={org:'宗教法人日本 クリスチャンコングレゲーション',nameJp:'藤社アトス ロベルト',namePt:'Atos Roberto Tosha',titleJp:'管理代表役員（会長）',titlePt:'Presidente',phone:'0566 93 1383',email:'CCj.secretariacentral@outlook.com',address:'〒446-0046 愛知県 安城市 赤松町西下40-8'};
function status(t){$('status').textContent=t;setTimeout(()=>{$('status').textContent=''},4000)}
function getData(){return Object.fromEntries(Object.keys(defaults).map(k=>[k,$(k).value.trim()]));}
function apply(d){Object.keys(defaults).forEach(k=>$(k).value=d[k]??defaults[k]);$('orgView').textContent=d.org;$('nameJpView').textContent=d.nameJp;$('namePtView').textContent=d.namePt;$('titleJpView').textContent=d.titleJp;$('titlePtView').textContent=d.titlePt;$('contactsView').innerHTML='☎ '+esc(d.phone)+'<br>✉ '+esc(d.email)+'<br>'+esc(d.address);$('callBtn').href='tel:+'+d.phone.replace(/\D/g,'');$('emailBtn').href='mailto:'+encodeURIComponent(d.email).replace(/%40/g,'@')+'?subject=Contato%20-%20'+encodeURIComponent(d.namePt);}
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));}
function save(){const d=getData();try{localStorage.setItem('cartaoDados',JSON.stringify(d));apply(d);status('Alterações salvas neste navegador.')}catch(e){status('Não foi possível salvar.')}}
try{const saved=JSON.parse(localStorage.getItem('cartaoDados')||'null');apply(saved||defaults);$('photo').src=localStorage.getItem('cartaoFoto')||fallback}catch(e){apply(defaults);$('photo').src=fallback}
$('editBtn').onclick=()=>{$('panel').classList.toggle('open');$('editBtn').textContent=$('panel').classList.contains('open')?'✏️ Fechar edição':'✏️ Editar cartão';if($('panel').classList.contains('open'))$('panel').scrollIntoView({behavior:'smooth',block:'start'})};
$('saveBtn').onclick=save;
$('translateBtn').onclick=()=>{const v=$('titlePt').value.trim().toLowerCase();const map={'presidente':'管理代表役員（会長）','vice-presidente':'副会長','secretário':'書記','secretaria':'事務局','tesoureiro':'会計','pastor':'牧師','ministro':'牧師','diácono':'執事','diacono':'執事'};if(map[v]){$('titleJp').value=map[v];status('Tradução sugerida. Revise e toque em Salvar alterações.')}else status('Não encontrei uma tradução segura para esse cargo. Digite o japonês manualmente.')};
$('photoFile').onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/'))return status('Selecione uma fotografia válida.');const r=new FileReader();r.onload=()=>{try{localStorage.setItem('cartaoFoto',r.result)}catch(e){}$('photo').src=r.result;status('Fotografia atualizada. Toque em Salvar alterações para concluir os dados.')};r.readAsDataURL(f)};
function makeVcard(){const d=getData();return ['BEGIN:VCARD','VERSION:3.0','FN:'+d.namePt,'N:'+d.namePt+';;;','ORG:'+d.org,'TITLE:'+d.titlePt,'TEL;TYPE=CELL:+'+d.phone.replace(/\D/g,''),'EMAIL:'+d.email,'ADR;TYPE=WORK:;;'+d.address.replace(/^〒[^ ]+ /,'')+';;;','URL:'+cardUrl,'NOTE:会社法人等番号 1803-05-009092','END:VCARD'].join('\r\n')}
$('contactBtn').onclick=async()=>{const file=new File([makeVcard()],'Atos_Roberto_Tosha.vcf',{type:'text/vcard'});try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:'Atos Roberto Tosha',files:[file]});status('No menu do iPhone, escolha Contatos para adicionar.');return}const url=URL.createObjectURL(file);window.location.href=url;setTimeout(()=>URL.revokeObjectURL(url),5000);status('Arquivo de contato preparado. Abra o .vcf e escolha Adicionar aos Contatos.')}catch(e){if(e.name!=='AbortError')status('Não foi possível abrir o contato. Tente novamente no Safari.')}};
$('copyBtn').onclick=async()=>{const d=getData();const text=`${d.namePt}\n${d.titlePt}\nTel: ${d.phone}\nE-mail: ${d.email}\n${d.address}`;try{await navigator.clipboard.writeText(text);status('Contato copiado.')}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();status('Contato copiado.')}};
$('shareBtn').onclick=async()=>{try{if(navigator.share){await navigator.share({title:'Cartão Digital — '+$('namePt').value,text:$('titlePt').value+' — '+$('email').value,url:cardUrl});status('Menu de compartilhamento aberto.')}else{await navigator.clipboard.writeText(cardUrl);status('Link do cartão copiado.')}}catch(e){if(e.name!=='AbortError')status('Compartilhamento cancelado ou indisponível.')}};
</script>
</body>
</html>
