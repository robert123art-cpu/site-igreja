<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Cartão Digital — Japan Christian Congregation</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans",Arial,sans-serif;background:#eef3f8;color:#142235}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:14px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.toolbar button{background:#063d78;color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:16px;cursor:pointer}

/* CARTÃO: estrutura rígida, sem elementos sobrepostos */
.business-card{position:relative;width:100%;aspect-ratio:1.586/1;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px #0002;display:flex;flex-direction:column}
.card-top{height:44%;flex:0 0 44%;background:#063d78;color:#fff;padding:3.5% 4%;display:flex;align-items:center;gap:4%;overflow:hidden}
.photo-wrap{width:29%;height:100%;flex:0 0 29%;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.photo{display:block;width:100%;height:100%;object-fit:cover;border:4px solid #c99a32;border-radius:9px;background:#dbe3eb;min-width:0;min-height:0}
.card-head{width:67%;flex:0 0 67%;min-width:0;overflow:hidden}
.org{font-size:clamp(12px,2.55vw,22px);line-height:1.13;font-weight:800;overflow-wrap:anywhere;word-break:break-word}
.sub{font-size:clamp(7px,1.25vw,12px);line-height:1.2;margin-top:6px;overflow-wrap:anywhere}

.card-body{height:56%;flex:0 0 56%;padding:3.5% 4%;display:flex;align-items:center;gap:4%;min-width:0;overflow:hidden}
.identity{width:72%;flex:0 0 72%;min-width:0;overflow:hidden}
.name{font-size:clamp(15px,3.2vw,27px);line-height:1.08;font-weight:800;overflow-wrap:anywhere;word-break:break-word}
.en{color:#063d78;font-size:clamp(12px,2.55vw,21px);line-height:1.1;font-weight:800;margin-top:5px;overflow-wrap:anywhere}
.title{color:#063d78;font-size:clamp(10px,1.85vw,15px);line-height:1.1;font-weight:800;margin-top:7px;overflow-wrap:anywhere;word-break:break-word}
.pt-title{font-size:clamp(9px,1.7vw,14px);line-height:1.1;margin-top:3px;overflow-wrap:anywhere}
.contacts{font-size:clamp(7px,1.35vw,11px);line-height:1.28;margin-top:8px;overflow-wrap:anywhere;word-break:break-word}
.qrbox{width:24%;flex:0 0 24%;max-width:125px;background:#fff;border:2px solid #c99a32;padding:4px;border-radius:5px;align-self:center;min-width:0;overflow:hidden}
.qrbox img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:contain}
.qrbox small{display:block;background:#063d78;color:#fff;text-align:center;font-size:clamp(6px,1.05vw,9px);line-height:1.1;padding:3px 1px;white-space:normal;overflow-wrap:anywhere}

.panel{background:#fff;border-radius:18px;padding:18px;margin-top:18px}
.panel input,.panel textarea{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #ccd5df;border-radius:9px;font:inherit}
.panel button{background:#063d78;color:#fff;border:0;border-radius:10px;padding:11px 14px;font-weight:700}

@media(max-width:520px){
 .wrap{padding:10px}
 .business-card{border-radius:14px}
 .card-top{padding:3% 3%;gap:3%}
 .photo-wrap{width:30%;flex-basis:30%}
 .card-head{width:67%;flex-basis:67%}
 .photo{border-width:3px}
 .card-body{padding:3% 3%;gap:3%}
 .identity{width:72%;flex-basis:72%}
 .qrbox{width:25%;flex-basis:25%;max-width:none;padding:3px}
}
@media(max-width:380px){
 .org{font-size:12px}
 .sub{font-size:7px}
 .name{font-size:14px}
 .en{font-size:12px}
 .title{font-size:9px}
 .pt-title{font-size:8px}
 .contacts{font-size:7px}
}
@media print{
 body{background:#fff}
 .toolbar,.panel{display:none}
 .wrap{max-width:none;padding:0}
 .business-card{box-shadow:none;border-radius:0}
}
</style>
</head>
<body>
<div class="wrap">
 <div class="toolbar">
  <button type="button" id="photoBtn">📷 Trocar fotografia</button>
  <input id="photoFile" type="file" accept="image/*" hidden>
  <button type="button" onclick="window.print()">🖨️ Imprimir / PDF</button>
 </div>

 <div class="business-card" aria-label="Cartão de visita digital">
  <div class="card-top">
   <div class="photo-wrap"><img id="photo" class="photo" alt="Fotografia"></div>
   <div class="card-head">
    <div class="org">宗教法人 日本クリスチャンコングレゲーション</div>
    <div class="sub">JAPAN CHRISTIAN CONGREGATION · RELIGIOUS CORPORATION</div>
   </div>
  </div>

  <div class="card-body">
   <div class="identity">
    <div class="name">アトス ロベルト 藤社</div>
    <div class="en">Roberto Tosha</div>
    <div class="title">管理代表役員（会長）</div>
    <div class="pt-title">Presidente da Administração</div>
    <div class="contacts">☎ 0566 93 1383<br>✉ CCj.secretariacentral@outlook.com<br>〒446-0046<br>愛知県 安城市 赤松町西下40-8</div>
   </div>
   <div class="qrbox">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Frobert123art-cpu.github.io%2Fsite-igreja%2F" alt="QR Code">
    <small>公式サイト / PRESENÇA</small>
   </div>
  </div>
 </div>

 <div class="panel">
  <h2>Cartão digital</h2>
  <label>Organização<input id="org" value="宗教法人 日本クリスチャンコングレゲーション"></label>
  <label>Nome<input id="name" value="アトス ロベルト 藤社"></label>
  <label>Cargo<input id="title" value="管理代表役員（会長）"></label>
  <button type="button" id="saveBtn">💾 Salvar dados</button>
 </div>
</div>
<script>
const $=id=>document.getElementById(id);
const fallback="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='600' height='800'><rect width='100%' height='100%' fill='#dbe3eb'/><text x='50%' y='48%' text-anchor='middle' font-family='Arial' font-size='34' fill='#5b6b7d'>FOTOGRAFIA</text></svg>");
try{$('photo').src=localStorage.getItem('cartaoFoto')||fallback}catch(e){$('photo').src=fallback}
$('photoBtn').addEventListener('click',()=>$('photoFile').click());
$('photoFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('Selecione uma fotografia válida.');return}const r=new FileReader();r.onload=()=>{$('photo').src=r.result;try{localStorage.setItem('cartaoFoto',r.result)}catch(err){alert('A foto foi carregada, mas não pôde ser salva neste dispositivo.')}};r.onerror=()=>alert('Não foi possível carregar a fotografia.');r.readAsDataURL(f)});
$('saveBtn').addEventListener('click',()=>{try{localStorage.setItem('cartaoOrg',$('org').value);localStorage.setItem('cartaoNome',$('name').value);localStorage.setItem('cartaoCargo',$('title').value);alert('Dados salvos.')}catch(e){alert('Não foi possível salvar os dados.')}});
</script>
</body>
</html>
